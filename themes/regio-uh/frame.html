<!-- Regio Utrechtse Heuvelrug theme frame: no decorative overlay, only the
     brand (logo + wordmark) adopted into the info bar's start slot.
     data-hoist puts it on document.body so infobar.js finds it on mount. -->
<div id="overlay-infobar-slot-start" data-hoist>
  <img class="ruh-logo" src="/themes/regio-uh/assets/logo-circle.png" alt="">
  <div class="ruh-wordmark">
    <span class="ruh-wordmark-top">Scouting</span>
    <span class="ruh-wordmark-main">Regio Utrechtse Heuvelrug</span>
  </div>
</div>
