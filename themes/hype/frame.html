<!-- DeHype theme frame: real-app shell — top nav bar with gradient wordmark
     + outline icons (Lucide), and a bottom tab bar mimic. Visual only. -->
<div id="hype-shell">
  <header id="hype-nav">
    <div class="hype-nav-brand">
      <svg viewBox="0 0 32 32" width="26" height="26" fill="none" aria-hidden="true" class="hype-brand-mark">
        <defs>
          <linearGradient id="hype-grad" x1="0" y1="0" x2="32" y2="32">
            <stop offset="0%"   stop-color="#ffc24a"/>
            <stop offset="35%"  stop-color="#ff2d87"/>
            <stop offset="70%"  stop-color="#a23bff"/>
            <stop offset="100%" stop-color="#2bc1ff"/>
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="26" height="26" rx="7" stroke="url(#hype-grad)" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="5.5" stroke="url(#hype-grad)" stroke-width="2.5"/>
        <circle cx="22.5" cy="9.5" r="1.5" fill="url(#hype-grad)"/>
      </svg>
      <span class="hype-brand-word">DeHype</span>
    </div>
    <nav class="hype-nav-icons" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21l8.84-8.61a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </nav>
  </header>

  <footer id="hype-tabbar" aria-hidden="true">
    <svg class="hype-tab active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2Z"/></svg>
    <svg class="hype-tab" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <svg class="hype-tab plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
    <svg class="hype-tab" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>
    <svg class="hype-tab" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
  </footer>
</div>
